<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bluepaper archive viewer</title>
<meta name="description" content="Read a personal social archive in your browser. The zip stays on your device.">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M10 6h9l4 4v16H10z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M19 6v5h4' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script>
try {
  var savedTheme = localStorage.getItem('bluepaper.theme');
  var bootTheme = savedTheme === 'dark' || savedTheme === 'light'
    ? savedTheme
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = bootTheme;
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  if (themeMeta) themeMeta.content = bootTheme === 'dark' ? '#0f1115' : '#2563eb';
  var savedLang = localStorage.getItem('bluepaper.lang');
  document.documentElement.lang = savedLang === 'en' ? 'en' : 'zh-Hant';
} catch (e) {
  document.documentElement.dataset.theme = 'light';
}
</script>
</head>
<body>

<div id="upload-screen" class="upload-screen">
  <div id="boot-tools" class="boot-tools"></div>
  <main class="upload-card">
    <div class="upload-brand">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5"/><path d="M9 12h6M9 16h6"/></svg>
      </span>
      <span class="brand-name">bluepaper</span>
      <span class="brand-tag" data-i18n="brand.tag">archive</span>
    </div>
    <h1 data-i18n="upload.title">Your archive, offline.</h1>
    <p class="upload-lede" data-i18n="upload.lede">Drop the .zip below to read your posts, photos, friends and messages.</p>

    <label id="drop-zone" class="drop-zone" for="zip-input">
      <span class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 5 17 10"/><line x1="12" y1="5" x2="12" y2="17"/></svg>
      </span>
      <strong data-i18n="upload.choose">Choose a .zip file</strong>
      <span class="drop-sub" data-i18n="upload.drop">or drag and drop it here</span>
      <input id="zip-input" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden>
    </label>

    <div id="load-status" class="load-status" role="status" aria-live="polite" hidden></div>

    <p class="privacy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span data-i18n="upload.privacy">The zip stays on this device. Nothing is uploaded or tracked.</span>
    </p>
    <p class="upload-hint" data-i18n="upload.hint">Get the .zip from Settings → Download your information.</p>
  </main>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/feed" aria-label="Bluepaper">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5"/><path d="M9 12h6M9 16h6"/></svg>
        </span>
        <span class="logo-text">bluepaper</span>
      </a>
      <form id="search-form" class="search" role="search">
        <span id="search-icon" class="search-icon" aria-hidden="true"></span>
        <input id="search-input" type="search" placeholder="Search your archive" autocomplete="off" aria-label="Search your archive">
      </form>
      <nav id="topnav" class="topnav" aria-label="Main"></nav>
      <div id="topbar-tools" class="topbar-tools"></div>
      <div id="topbar-user" class="topbar-user"></div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="main" class="main" tabindex="-1"></main>
    <aside id="rail" class="rail"></aside>
  </div>

  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<noscript><p style="padding:24px;text-align:center"><span lang="en">This viewer needs JavaScript enabled.</span><br><span lang="zh-Hant">此檢視器需要啟用 JavaScript。</span></p></noscript>
<script src="i18n/en.js"></script>
<script src="i18n/zh-Hant.js"></script>
<script src="app.js"></script>
</body>
</html>
